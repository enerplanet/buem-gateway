openapi: 3.0.3

info:
  title: buem-gateway API
  version: 5.0.0
  description: |
    buem-gateway is the connector between EnerPlanET and
    [BuEM](https://github.com/enerplanet/buem), the ISO 52016-1 thermal building
    model. It fans a building, or a topology of several buildings, out to BuEM,
    writes each building's heating, cooling, and electricity load profiles to
    CSV, and returns the enriched result.

    `buem.building.envelope` is required on every building. buem-gateway derives
    it from nothing and calls no external service to resolve it. See
    [Envelope is required](https://github.com/enerplanet/buem-gateway/blob/main/docs/api.md#envelope-is-required)
    for the rejection behaviour and error shape.

    ## Versioning

    The `version` field above is the BuEM/EnerPlanET data-contract version. It
    matches the "v5" schemas in `schemas/request_schema.json` and
    `schemas/response_schema.json`, and is tracked in
    [CHANGELOG.md](https://github.com/enerplanet/buem-gateway/blob/main/CHANGELOG.md)
    and [versioning.md](https://github.com/enerplanet/buem-gateway/blob/main/docs/versioning.md).

    It is not buem-gateway's own service release number. Those follow separate,
    independent numbering and are the only ones that carry a git tag, under
    [GitHub Releases](https://github.com/enerplanet/buem-gateway/releases).

    ## Authentication

    buem-gateway has no authentication of its own. It runs behind a reverse proxy
    (Caddy), which is the only way to reach it: callers send a valid `X-Api-Key`
    header, and the proxy rejects anything else with `403` before the request
    reaches buem-gateway.

    Call it from a trusted server-side caller, never directly from a browser or an
    end user's client, since the key must not be visible outside that caller. The
    key is a prototype-stage credential; replacing it with short-lived tokens or
    mutual TLS would not change the endpoint contract below.
  license:
    name: MIT
    url: https://github.com/enerplanet/buem-gateway/blob/main/LICENSE
  contact:
    name: enerplanet
    url: https://github.com/enerplanet/buem-gateway

servers:
  - url: https://localhost:8443
    description: Local development, via the reverse proxy (buem-reverse-proxy)
  - url: https://{host}
    description: Deployed behind the platform's reverse proxy
    variables:
      host:
        default: buem-gateway.example.org
        description: The public host the reverse proxy is published on

tags:
  - name: Health
    description: Liveness check
  - name: Simulation
    description: Run BuEM and retrieve load profiles

security:
  - ApiKeyAuth: []

paths:
  /buem/health:
    get:
      tags: [Health]
      operationId: checkHealth
      summary: Liveness check
      security: []
      description: Returns 200 while the connector is running. Does not check BuEM's own health, and does not require an API key.
      responses:
        "200":
          description: Server is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/v1/buem/building:
    post:
      tags: [Simulation]
      operationId: runBuilding
      summary: Run BuEM for one building
      description: >
        For a caller with exactly one building and no grid to describe, such as
        the Building Configurator. No topology or edge-list wrapper. Unlike
        `/api/v1/buem/topology`, a failed run is reported as an HTTP error, since
        with a single building there is no partial success to preserve.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuildingRequest"
            examples:
              singleBuilding:
                $ref: "#/components/examples/SingleBuilding"
      responses:
        "200":
          description: Building processed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildingResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/RunFailed"

  /api/v1/buem/validate:
    post:
      tags: [Simulation]
      operationId: validateBuilding
      summary: Pre-flight-check a single-building request
      description: >
        Same request body as `/api/v1/buem/building` -- checks that
        `building.envelope` and `buem.weather` are both present with usable
        data, without ever calling BuEM. Lets a caller (e.g. the
        Orchestrator) confirm a request is well-formed before paying for the
        real run. A `200` here does not itself guarantee BuEM will accept
        the request -- only that the two things buem-gateway itself checks
        are present.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuildingRequest"
            examples:
              singleBuilding:
                $ref: "#/components/examples/SingleBuilding"
      responses:
        "200":
          description: Request is well-formed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/buem/topology:
    post:
      tags: [Simulation]
      operationId: runTopology
      summary: Run BuEM for every building in a topology
      description: >
        Buildings are the nodes of a `{from, to}` edge list, the shape
        EnerPlanET's grid topology already uses elsewhere, identified by
        `properties.feature_type == "BasePOI"` and a non-null `properties.buem`
        block. Non-building nodes and edges pass through unchanged. A building
        that fails is returned exactly as it was sent, and the failure is logged
        server-side rather than reported in the response body, so check for the
        presence of `thermal_load_profile` before reading it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TopologyRequest"
      responses:
        "200":
          description: Topology processed. Individual buildings may have failed; see the endpoint description.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopologyResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
      description: >
        Static key checked by the reverse proxy. Sent by the trusted caller, not
        by an end user's browser. A request without a valid key is rejected with
        403 before it reaches buem-gateway.

  responses:
    BadRequest:
      description: >
        Malformed or incomplete request: unreadable body, missing buem block,
        missing building.envelope, or missing/unusable buem.weather. Rejected
        before BuEM is called.
      content:
        text/plain:
          schema:
            type: string
          example: "buem block is required"
    Forbidden:
      description: Missing or invalid API key (enforced by the reverse proxy)
      content:
        text/plain:
          schema:
            type: string
          example: "Forbidden: missing or invalid API key"
    RunFailed:
      description: >
        BuEM rejected the request or failed to process it after buem-gateway
        forwarded it, for example on invalid parameter values. Distinct from 400
        in that the request reached BuEM before failing.
      content:
        text/plain:
          schema:
            type: string
          example: "buem run failed: BuEM request: request to ... failed with status 400: ..."

  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
      required: [status]

    ValidateResponse:
      type: object
      properties:
        valid:
          type: boolean
          example: true
      required: [valid]

    Geometry:
      type: object
      description: GeoJSON Point, ordered [longitude, latitude].
      properties:
        type:
          type: string
          example: Point
        coordinates:
          type: array
          items:
            type: number
          minItems: 2
          maxItems: 3
      required: [coordinates]

    BuemBlock:
      type: object
      description: >
        The building's classification, envelope, thermal, solver, and weather
        data. See `schemas/request_schema.json` in this repo for the full
        BuEM request contract. Forwarded to BuEM largely as-is; `envelope`
        and `weather` are both required -- buem-gateway resolves neither
        from any external service, the caller must supply both complete.
      additionalProperties: true

    BuildingRequest:
      type: object
      properties:
        id:
          type: string
          description: Optional, used for logging and CSV filenames. Defaults to "building".
          example: demo-building
        geometry:
          $ref: "#/components/schemas/Geometry"
        model_id:
          type: string
          description: Isolates output. CSVs are written under `{BUEM_DATA_DIR}/{model_id}/`.
          example: demo-model-001
        start_date:
          type: string
          format: date-time
          description: Simulation window start.
        end_date:
          type: string
          format: date-time
        resolution:
          type: integer
          description: Output resolution in minutes.
          example: 60
        buem:
          $ref: "#/components/schemas/BuemBlock"
      required: [buem]

    BuildingResponse:
      type: object
      properties:
        id:
          type: string
          example: demo-building
        buem:
          $ref: "#/components/schemas/BuemBlock"
          description: Enriched with `thermal_load_profile` and `model_metadata`.
      required: [id, buem]

    TopologyNode:
      type: object
      description: One GeoJSON-shaped node. Only BasePOI nodes with a non-null buem block are treated as buildings.
      properties:
        id:
          type: string
        geometry:
          $ref: "#/components/schemas/Geometry"
        properties:
          type: object
          properties:
            feature_type:
              type: string
              example: BasePOI
            buem:
              $ref: "#/components/schemas/BuemBlock"
      required: [id, geometry, properties]

    TopologyEdge:
      type: object
      properties:
        from:
          $ref: "#/components/schemas/TopologyNode"
        to:
          $ref: "#/components/schemas/TopologyNode"

    TopologyRequest:
      type: object
      properties:
        model_id:
          type: string
          example: demo-model-001
        start_date:
          type: string
          format: date-time
        end_date:
          type: string
          format: date-time
        resolution:
          type: integer
          example: 60
        topology:
          type: array
          items:
            $ref: "#/components/schemas/TopologyEdge"
      required: [start_date, end_date, topology]

    TopologyResponse:
      type: object
      description: The same shape as TopologyRequest, with each processed building's buem block enriched.
      properties:
        model_id:
          type: string
        start_date:
          type: string
        end_date:
          type: string
        resolution:
          type: integer
        topology:
          type: array
          items:
            $ref: "#/components/schemas/TopologyEdge"

  examples:
    SingleBuilding:
      summary: One SFH with a complete envelope
      description: >
        A complete, runnable request. The envelope is given in full because
        buem-gateway will not derive it from the classification fields, and
        weather is likewise given in full -- buem-gateway does not resolve
        it either. In practice the Orchestrator supplies weather here,
        typically via weather serve's GET /v1/weather/point?format=json.
      value:
        id: demo-building
        geometry:
          type: Point
          coordinates: [12.95772, 48.833911]
        model_id: demo-model-001
        start_date: "2018-01-01T00:00:00Z"
        end_date: "2018-12-31T23:00:00Z"
        resolution: 60
        buem:
          building:
            name: Building 1
            building_type: SFH
            construction_period: "06"
            country: DE
            n_storeys: 2
            A_ref: { value: 120, unit: m2 }
            h_room: { value: 2.5, unit: m }
            neighbour_status: B_Alone
            attic_condition: N
            cellar_condition: N
            envelope:
              elements:
                - { id: Wall_1, type: wall, area: { value: 30, unit: m2 }, azimuth: { value: 0, unit: deg }, tilt: { value: 90, unit: deg }, U: { value: 1.6, unit: W/(m2K) }, b_transmission: { value: 1, unit: "-" } }
                - { id: Wall_2, type: wall, area: { value: 25, unit: m2 }, azimuth: { value: 90, unit: deg }, tilt: { value: 90, unit: deg }, U: { value: 1.4, unit: W/(m2K) }, b_transmission: { value: 1, unit: "-" } }
                - { id: Wall_3, type: wall, area: { value: 30, unit: m2 }, azimuth: { value: 180, unit: deg }, tilt: { value: 90, unit: deg }, U: { value: 1.6, unit: W/(m2K) }, b_transmission: { value: 1, unit: "-" } }
                - { id: Wall_4, type: wall, area: { value: 25, unit: m2 }, azimuth: { value: 270, unit: deg }, tilt: { value: 90, unit: deg }, U: { value: 1.6, unit: W/(m2K) }, b_transmission: { value: 1, unit: "-" } }
                - { id: Roof_1, type: roof, area: { value: 100, unit: m2 }, azimuth: { value: 180, unit: deg }, tilt: { value: 30, unit: deg }, U: { value: 1.2, unit: W/(m2K) } }
                - { id: Floor_1, type: floor, area: { value: 100, unit: m2 }, azimuth: { value: 0, unit: deg }, tilt: { value: 0, unit: deg }, U: { value: 1.5, unit: W/(m2K) }, b_transmission: { value: 0.8, unit: "-" } }
                - { id: Win_1, type: window, area: { value: 6, unit: m2 }, azimuth: { value: 0, unit: deg }, tilt: { value: 90, unit: deg }, parent_id: Wall_1, U: { value: 2.8, unit: W/(m2K) }, g_gl: { value: 0.6, unit: "-" } }
                - { id: Win_2, type: window, area: { value: 8, unit: m2 }, azimuth: { value: 180, unit: deg }, tilt: { value: 90, unit: deg }, parent_id: Wall_3, U: { value: 2.8, unit: W/(m2K) }, g_gl: { value: 0.6, unit: "-" } }
                - { id: Door_1, type: door, area: { value: 2, unit: m2 }, azimuth: { value: 0, unit: deg }, tilt: { value: 90, unit: deg }, parent_id: Wall_1, U: { value: 3, unit: W/(m2K) } }
                - { id: Vent_1, type: ventilation, air_changes: { value: 0.5, unit: 1/h } }
          thermal:
            n_air_infiltration: { value: 0.5, unit: 1/h }
            n_air_use: { value: 0.5, unit: 1/h }
            thermal_class: medium
            comfortT_lb: { value: 21, unit: degC }
            comfortT_ub: { value: 24, unit: degC }
          solver:
            compute_cooling: false
          weather:
            index: ["2018-01-01T00:30:00Z", "2018-01-01T01:30:00Z"]
            variables:
              T: [0.89, 0.72]
              GHI: [0.0, 0.0]
              DNI: [0.0, 0.0]
              DHI: [0.0, 0.0]