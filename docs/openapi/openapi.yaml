openapi: 3.0.3

info:
  title: buem-gateway API
  version: 5.0.0
  description: |
    buem-gateway connects EnerPlanET to
    [BuEM](https://github.com/enerplanet/buem), the ISO 52016-1 thermal building model. It accepts one building or a flat list of buildings, forwards each to BuEM, writes the resulting heating, cooling, and electricity load profiles to CSV, and returns one result per building.

    `buem.building.envelope` and `buem.weather` are required on every request. buem-gateway resolves neither from any external service. See
    [Envelope is required](https://github.com/enerplanet/buem-gateway/blob/main/docs/api.md#envelope-is-required)
    for rejection behaviour and error shape.

    ## Versioning

    The `version` field is the BuEM/EnerPlanET data-contract version. It matches the v5 schemas in `schemas/request_schema.json` and `schemas/response_schema.json`, tracked in [CHANGELOG.md](https://github.com/enerplanet/buem-gateway/blob/main/CHANGELOG.md) and [versioning.md](https://github.com/enerplanet/buem-gateway/blob/main/docs/versioning.md).

    buem-gateway's own service releases use separate, independent numbering and are the only versions carrying a git tag. See
    [GitHub Releases](https://github.com/enerplanet/buem-gateway/releases).

    ## Authentication

    buem-gateway performs no authentication. It runs behind a Caddy reverse proxy, which is the only route to it. Callers send a valid `X-Api-Key` header; the proxy rejects anything else with `403` before the request reaches buem-gateway.

    The key must not be exposed outside a trusted server-side caller. Replacing it with short-lived tokens or mutual TLS would not change the contract below.
  license:
    name: MIT
    url: https://github.com/enerplanet/buem-gateway/blob/main/LICENSE
  contact:
    name: enerplanet
    url: https://github.com/enerplanet/buem-gateway

servers:
  - url: https://localhost:8443
    description: Local development, via the reverse proxy (buem-reverse-proxy)
  - url: https://{host}
    description: Deployed behind the platform's reverse proxy
    variables:
      host:
        default: buem-gateway.example.org
        description: The public host the reverse proxy is published on

tags:
  - name: Health
    description: Liveness check
  - name: Simulation
    description: Run BuEM and retrieve load profiles

security:
  - ApiKeyAuth: []

paths:
  /buem/health:
    get:
      tags: [Health]
      operationId: checkHealth
      summary: Liveness check
      security: []
      description: >
        Returns 200 while the connector is running. Does not check BuEM's
        availability. No API key required.
      responses:
        "200":
          description: Server is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/v1/buem/building:
    post:
      tags: [Simulation]
      operationId: runBuilding
      summary: Run BuEM for one building
      description: >
        Runs BuEM for a single building and returns its load profiles.

        Serves callers that hold one building at a time, such as the Building Configurator. Failure is reported through the HTTP status: 400 for a malformed or incomplete request, 422 when BuEM rejects the run. Shares a request body with `/api/v1/buem/validate`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuildingRequest"
            examples:
              singleBuilding:
                $ref: "#/components/examples/SingleBuilding"
      responses:
        "200":
          description: Building processed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildingResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/RunFailed"

  /api/v1/buem/validate:
    post:
      tags: [Simulation]
      operationId: validateBuilding
      summary: Pre-flight-check a single-building request
      description: >
        Checks that `building.envelope` and `buem.weather` are present with
        usable data. BuEM is not called.

        Accepts the same request body as `/api/v1/buem/building`. A 200 response  confirms only the two checks buem-gateway performs; BuEM may still reject the request at run time. Validates one building per call.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuildingRequest"
            examples:
              singleBuilding:
                $ref: "#/components/examples/SingleBuilding"
      responses:
        "200":
          description: Request is well-formed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/buem/buildings:
    post:
      tags: [Simulation]
      operationId: runBuildings
      summary: Run BuEM for a flat list of buildings
      description: >
        Runs BuEM for a flat list of buildings and returns one result per
        building, in request order.

        The list carries no topology or edge-list wrapper. Any grid concept
        linking the buildings is owned by the caller.

        `weather` is supplied once at request level and attached to every
        building server-side. `envelope` is per building, under each building's own `building` field.

        Failure is reported per building. A missing envelope, missing shared weather, or a BuEM rejection produces an `error` entry for that building alone; every other building still runs and the response status is 200. A malformed request body is rejected with 400 before any building is processed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuildingsRequest"
            examples:
              multipleBuildings:
                $ref: "#/components/examples/MultipleBuildings"
      responses:
        "200":
          description: Request processed. Individual buildings may have failed; see each result's `error` field.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildingsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
      description: >
        Static key checked by the reverse proxy. Sent by the trusted caller, not by an end user's browser. A request without a valid key is rejected with 403 before it reaches buem-gateway.

  responses:
    BadRequest:
      description: >
        Malformed or incomplete request: unreadable body, missing buem block, missing building.envelope, or missing/unusable buem.weather. Rejected before BuEM is called.
      content:
        text/plain:
          schema:
            type: string
          example: "buem block is required"
    Forbidden:
      description: Missing or invalid API key (enforced by the reverse proxy)
      content:
        text/plain:
          schema:
            type: string
          example: "Forbidden: missing or invalid API key"
    RunFailed:
      description: >
        BuEM rejected the request or failed to process it after buem-gateway forwarded it, for example on invalid parameter values. Distinct from 400 in that the request reached BuEM before failing.
      content:
        text/plain:
          schema:
            type: string
          example: "buem run failed: BuEM request: request to ... failed with status 400: ..."

  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
      required: [status]

    ValidateResponse:
      type: object
      properties:
        valid:
          type: boolean
          example: true
      required: [valid]

    Geometry:
      type: object
      description: GeoJSON Point, ordered [longitude, latitude].
      properties:
        type:
          type: string
          example: Point
        coordinates:
          type: array
          items:
            type: number
          minItems: 2
          maxItems: 3
      required: [coordinates]

    BuemBlock:
      type: object
      description: >
        The building's classification, envelope, thermal, solver, and weather data. See `schemas/request_schema.json` in this repo for the full BuEM request contract. Forwarded to BuEM largely as-is; `envelope` and `weather` are both required -- buem-gateway resolves neither from any external service, the caller must supply both complete.
      additionalProperties: true

    BuildingRequest:
      type: object
      properties:
        id:
          type: string
          description: Optional, used for logging and CSV filenames. Defaults to "building".
          example: demo-building
        geometry:
          $ref: "#/components/schemas/Geometry"
        model_id:
          type: string
          description: Isolates output. CSVs are written under `{BUEM_DATA_DIR}/{model_id}/`.
          example: demo-model-001
        start_date:
          type: string
          format: date-time
          description: Simulation window start.
        end_date:
          type: string
          format: date-time
        resolution:
          type: integer
          description: Output resolution in minutes.
          example: 60
        buem:
          $ref: "#/components/schemas/BuemBlock"
      required: [buem]

    BuildingResponse:
      type: object
      properties:
        id:
          type: string
          example: demo-building
        buem:
          $ref: "#/components/schemas/BuemBlock"
          description: Enriched with `thermal_load_profile` and `model_metadata`.
      required: [id, buem]

    WeatherBlock:
      type: object
      description: >
        Shape matches weather serve's `GET /v1/weather/point?format=json`
        response exactly: an index of ISO 8601 timestamps and one array per
        variable, aligned to it. At least one of T/GHI/DNI/DHI is required --
        buem-gateway does not resolve weather from any external service, the caller must supply a pre-resolved timeseries.
      properties:
        index:
          type: array
          items:
            type: string
            format: date-time
        variables:
          type: object
          additionalProperties:
            type: array
            items:
              type: number
          example: { T: [0.89, 0.72], GHI: [0.0, 0.0] }
      required: [index, variables]

    BuildingBlock:
      type: object
      description: >
        One building's classification, envelope, and thermal data -- the same
        content as `BuemBlock.building`, without `weather` (see
        `BuildingsRequest.weather`, shared across the whole request instead of repeated per building). See `schemas/request_schema.json` in this repo for the full field set. `envelope` is required -- buem-gateway resolves it from nothing and calls no external service.
      additionalProperties: true

    BuildingListItem:
      type: object
      properties:
        id:
          type: string
          description: Used for logging, CSV filenames, and matching this building's result back to it in the response.
          example: "111"
        geometry:
          $ref: "#/components/schemas/Geometry"
        building:
          $ref: "#/components/schemas/BuildingBlock"
      required: [id, geometry, building]

    BuildingsRequest:
      type: object
      properties:
        model_id:
          type: string
          example: demo-model-001
        start_date:
          type: string
          format: date-time
        end_date:
          type: string
          format: date-time
        resolution:
          type: integer
          example: 60
        weather:
          $ref: "#/components/schemas/WeatherBlock"
        buildings:
          type: array
          items:
            $ref: "#/components/schemas/BuildingListItem"
      required: [start_date, end_date, weather, buildings]

    BuildingResultItem:
      type: object
      description: >
        Exactly one of `buem`/`error` is present, never both -- `buem` on
        success (enriched with `thermal_load_profile` and model_metadata`), `error` naming why this one building has no result. One building's error never affects any other building's entry in the same response.
      properties:
        id:
          type: string
        buem:
          $ref: "#/components/schemas/BuemBlock"
        error:
          type: string
      required: [id]

    BuildingsResponse:
      type: array
      description: One result per request building, in the same order as `BuildingsRequest.buildings`.
      items:
        $ref: "#/components/schemas/BuildingResultItem"

  examples:
    SingleBuilding:
      summary: One SFH with a complete envelope
      description: >
        A complete, runnable request. The envelope is given in full because
        buem-gateway will not derive it from the classification fields, and
        weather is likewise given in full -- buem-gateway does not resolve
        it either. In practice the Orchestrator supplies weather here,
        typically via weather serve's GET /v1/weather/point?format=json.
      value:
        id: demo-building
        geometry:
          type: Point
          coordinates: [12.95772, 48.833911]
        model_id: demo-model-001
        start_date: "2018-01-01T00:00:00Z"
        end_date: "2018-12-31T23:00:00Z"
        resolution: 60
        buem:
          building:
            name: Building 1
            building_type: SFH
            construction_period: "06"
            country: DE
            n_storeys: 2
            A_ref: { value: 120, unit: m2 }
            h_room: { value: 2.5, unit: m }
            neighbour_status: B_Alone
            attic_condition: N
            cellar_condition: N
            envelope:
              elements:
                - { id: Wall_1, type: wall, area: { value: 30, unit: m2 }, azimuth: { value: 0, unit: deg }, tilt: { value: 90, unit: deg }, U: { value: 1.6, unit: W/(m2K) }, b_transmission: { value: 1, unit: "-" } }
                - { id: Wall_2, type: wall, area: { value: 25, unit: m2 }, azimuth: { value: 90, unit: deg }, tilt: { value: 90, unit: deg }, U: { value: 1.4, unit: W/(m2K) }, b_transmission: { value: 1, unit: "-" } }
                - { id: Wall_3, type: wall, area: { value: 30, unit: m2 }, azimuth: { value: 180, unit: deg }, tilt: { value: 90, unit: deg }, U: { value: 1.6, unit: W/(m2K) }, b_transmission: { value: 1, unit: "-" } }
                - { id: Wall_4, type: wall, area: { value: 25, unit: m2 }, azimuth: { value: 270, unit: deg }, tilt: { value: 90, unit: deg }, U: { value: 1.6, unit: W/(m2K) }, b_transmission: { value: 1, unit: "-" } }
                - { id: Roof_1, type: roof, area: { value: 100, unit: m2 }, azimuth: { value: 180, unit: deg }, tilt: { value: 30, unit: deg }, U: { value: 1.2, unit: W/(m2K) } }
                - { id: Floor_1, type: floor, area: { value: 100, unit: m2 }, azimuth: { value: 0, unit: deg }, tilt: { value: 0, unit: deg }, U: { value: 1.5, unit: W/(m2K) }, b_transmission: { value: 0.8, unit: "-" } }
                - { id: Win_1, type: window, area: { value: 6, unit: m2 }, azimuth: { value: 0, unit: deg }, tilt: { value: 90, unit: deg }, parent_id: Wall_1, U: { value: 2.8, unit: W/(m2K) }, g_gl: { value: 0.6, unit: "-" } }
                - { id: Win_2, type: window, area: { value: 8, unit: m2 }, azimuth: { value: 180, unit: deg }, tilt: { value: 90, unit: deg }, parent_id: Wall_3, U: { value: 2.8, unit: W/(m2K) }, g_gl: { value: 0.6, unit: "-" } }
                - { id: Door_1, type: door, area: { value: 2, unit: m2 }, azimuth: { value: 0, unit: deg }, tilt: { value: 90, unit: deg }, parent_id: Wall_1, U: { value: 3, unit: W/(m2K) } }
                - { id: Vent_1, type: ventilation, air_changes: { value: 0.5, unit: 1/h } }
          thermal:
            n_air_infiltration: { value: 0.5, unit: 1/h }
            n_air_use: { value: 0.5, unit: 1/h }
            thermal_class: medium
            comfortT_lb: { value: 21, unit: degC }
            comfortT_ub: { value: 24, unit: degC }
          solver:
            compute_cooling: false
          weather:
            index: ["2018-01-01T00:30:00Z", "2018-01-01T01:30:00Z"]
            variables:
              T: [0.89, 0.72]
              GHI: [0.0, 0.0]
              DNI: [0.0, 0.0]
              DHI: [0.0, 0.0]

    MultipleBuildings:
      summary: Two buildings sharing one weather timeseries
      description: >
        Same envelope content as SingleBuilding, reshaped for `/api/v1/buem/buildings`: `weather` is given once at the top level
        instead of once per building.
      value:
        model_id: demo-model-001
        start_date: "2018-01-01T00:00:00Z"
        end_date: "2018-12-31T23:00:00Z"
        resolution: 60
        weather:
          index: ["2018-01-01T00:30:00Z", "2018-01-01T01:30:00Z"]
          variables:
            T: [0.89, 0.72]
            GHI: [0.0, 0.0]
            DNI: [0.0, 0.0]
            DHI: [0.0, 0.0]
        buildings:
          - id: "111"
            geometry:
              type: Point
              coordinates: [12.95772, 48.833911]
            building:
              building_type: SFH
              country: DE
              envelope:
                elements:
                  - { id: Wall_1, type: wall, area: { value: 30, unit: m2 }, azimuth: { value: 0, unit: deg }, tilt: { value: 90, unit: deg }, U: { value: 1.6, unit: W/(m2K) }, b_transmission: { value: 1, unit: "-" } }
          - id: "222"
            geometry:
              type: Point
              coordinates: [12.958071, 48.833847]
            building:
              building_type: MFH
              country: DE
              envelope:
                elements:
                  - { id: Wall_1, type: wall, area: { value: 90, unit: m2 }, azimuth: { value: 0, unit: deg }, tilt: { value: 90, unit: deg }, U: { value: 1.2, unit: W/(m2K) }, b_transmission: { value: 1, unit: "-" } }