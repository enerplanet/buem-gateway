# Compose project name = the concern this stack belongs to. ignis and buem are both building-simulation concerns and share this namespace — see THD-Spatial-AI/ignis's environment/docker-compose.yml, which already anticipates this (its .env.example: "several services (ignis, buem, …) run side by side"). Running `docker compose up` in both repos on the same host puts every container on the same `building-simulation_default` network, without either repo depending on the other.
name: building-simulation

# Container naming convention: <service>-<role>, where role is one of reverse-proxy | app | model. Matches ignis's <service>-app / <service>-db / <service>-reverse-proxy shape. buem-model is the "app" role's backing service, the way a db would be for ignis.
services:
  # The actual BuEM thermal model (Flask/Gunicorn, Python). Not reachable from the host or from outside this network — only buem-gateway calls it.
  buem-model:
    container_name: buem-model
    image: ghcr.io/enerplanet/buem-model:${BUEM_IMAGE_TAG:-latest}
    env_file: env/common.env
    environment:
      - PYTHONPATH=/buem/src
      - BUEM_CBC_EXE=/opt/conda/envs/buem_env/bin/cbc
      # No weather archive or service: every request carries its own resolved
      # timeseries, and BUEM_WEATHER_FALLBACK=false skips buem-model's
      # module-load default fetch too. See docs/getting-started.md.
      - BUEM_WEATHER_FALLBACK=false
      - GUNICORN_WORKERS=${BUEM_WORKERS:-2}
    volumes:
      - buem-results-data:/app/results
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5
    # No `ports:` mapping — reachable only from buem-gateway, by service name.

  # The Go connector: EnerPlanET's topology-JSON contract in, BuEM's
  # per-building GeoJSON contract out. See ../internal/buem.
  buem-gateway:
    container_name: buem-gateway
    image: ghcr.io/enerplanet/buem-gateway:${BUEM_IMAGE_TAG:-latest}
    env_file: env/common.env
    environment:
      - APP_PORT=${APP_PORT}
      - BUEM_SERVICE_HOST=buem-model
      - BUEM_SERVICE_PORT=5000
      - BUEM_DATA_DIR=/app/data
      - BUEM_RESULTS_DIR=/app/results
    volumes:
      - buem-csv-data:/app/data
      - buem-results-data:/app/results
    depends_on:
      buem-model:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:$$APP_PORT/buem/health"]
      interval: 5s
      timeout: 3s
      retries: 5
    # No `ports:` mapping here on purpose — only the reverse proxy is exposed;
    # everyone else must go through it.

  buem-reverse-proxy:
    image: caddy:2.11-alpine
    container_name: buem-reverse-proxy
    env_file: [env/common.env, env/proxy.env] # provides ALLOWED_ORIGINS and BUEM_API_KEY
    environment:
      - APP_PORT=${APP_PORT}
    depends_on:
      buem-gateway:
        condition: service_healthy
    ports:
      - "${HOST_HTTPS_PORT:-8443}:443" # host side assignable per service, so it doesn't collide with ignis's own 443
    volumes:
      # Directory mount, not per-file: a single-file bind mount silently
      # serves stale content after an edit (see ignis's docker-compose.yml).
      - ./caddy:/etc/caddy:ro
      - ${CADDY_DATA_DIR}:/data/caddy # reuse the host's already-trusted local CA
    # Same ALLOWED_ORIGINS -> regex derivation as ignis's reverse proxy — see
    # that repo's docker-compose.yml for the full rationale.
    entrypoint:
      - sh
      - -c
      - >
        export ALLOWED_ORIGINS_PATTERN="^($$(echo "$$ALLOWED_ORIGINS" | sed -e 's/[.]/\\./g' -e 's/,/|/g'))$$" &&
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile

volumes:
  buem-csv-data:
  buem-results-data:
