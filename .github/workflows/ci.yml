name: CI

on:
  push:
    branches: ["main"]
    paths:
      - "schemas/**"
  # No paths filter on pull requests: this job is a required check on main,
  # and a filtered-out run never reports, which blocks every unrelated PR.
  pull_request:
    branches: ["main"]

jobs:
  validate-schemas:
    name: Validate JSON schemas against examples
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install jsonschema
        run: pip install jsonschema

      - name: Validate schemas and version sync
        run: python scripts/validate_schemas.py

      - name: Test v6-draft output selection
        run: python scripts/v6_draft_outputs_test.py
